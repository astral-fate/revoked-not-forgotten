[project]
name = "revres"
version = "0.1.0"
description = "Revoked but not forgotten: residual influence of revoked agents in LLM agent teams"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "matplotlib>=3.7"]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
