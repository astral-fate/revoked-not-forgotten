<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><style>
.h1{font-size:34px;font-weight:700;fill:#0F172A}.h2{font-size:23px;font-weight:700;fill:#0F172A}
.h3{font-size:17px;font-weight:700;fill:#0F172A}.t{font-size:15px;fill:#1E293B}.t2{font-size:14px;fill:#1E293B}
.t2b{font-size:14px;font-weight:700;fill:#0F172A}.s{font-size:13px;fill:#475569}.th{font-size:13px;font-weight:700;fill:#FFFFFF}
.tag{font-size:12px;font-weight:700;fill:#FFFFFF}.hw{font-size:19px;font-weight:700;fill:#FFFFFF}
.m{font-family:Consolas, monospace;font-size:13px;fill:#1E293B}.big{font-size:40px;font-weight:700}
</style></defs>
<rect width="1600" height="1040" fill="#F8FAFC"/>
<text x="60" y="58" class="h1">Revoked but not forgotten: how a revoked agent keeps steering the team</text>
<text x="60" y="92" class="t">A compromised worker's content is handed on before it is revoked. We measure whether the executor still acts on it, and which platform response removes it.</text>
<rect x="60" y="110" width="143" height="22" rx="11" fill="#B91C1C"/>
<text x="131.6" y="125" class="tag" text-anchor="middle">compromised agent</text>
<rect x="213.2" y="110" width="105" height="22" rx="11" fill="#047857"/>
<text x="265.79999999999995" y="125" class="tag" text-anchor="middle">honest agent</text>
<rect x="328.4" y="110" width="219" height="22" rx="11" fill="#2563EB"/>
<text x="438.0" y="125" class="tag" text-anchor="middle">design the paper argues for</text>
<text x="60" y="182" class="h2">1 · The agent team and the moment of revocation</text>
<rect x="60" y="206" width="340" height="222" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="80" y="238" class="h3">Shared team board</text>
<rect x="76" y="256" width="308" height="46" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="90" y="276" class="t2b">planner</text>
<text x="90" y="294" class="s">posts the plan for the ticket</text>
<rect x="76" y="312" width="308" height="46" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="90" y="332" class="t2b">worker-X</text>
<text x="90" y="350" class="s">false value with a code (+ export request)</text>
<rect x="76" y="368" width="308" height="46" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.4"/>
<text x="90" y="388" class="t2b">worker-Y</text>
<text x="90" y="406" class="s">checks the refund; can redo X's lookup</text>
<line x1="400" y1="318.0" x2="446" y2="318.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="448" y="262" width="262" height="112" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
<text x="579.0" y="306.0" class="h3" text-anchor="middle">Writer (LLM)</text>
<text x="579.0" y="327.0" class="s" text-anchor="middle">folds the board into a handoff</text>
<text x="579.0" y="345.0" class="s" text-anchor="middle">cites message ids; cached per seed</text>
<rect x="752" y="206" width="92" height="196" rx="10" fill="#FFF5F5" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="798.0" y="232" class="h3" text-anchor="middle" style="fill:#B91C1C">t3</text>
<text x="798.0" y="258" class="t2b" text-anchor="middle" style="fill:#B91C1C">worker-X</text>
<text x="798.0" y="276" class="t2b" text-anchor="middle" style="fill:#B91C1C">revoked</text>
<line x1="710" y1="318.0" x2="884" y2="318.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="886" y="262" width="300" height="112" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
<text x="1036.0" y="306.0" class="h3" text-anchor="middle">Executor (LLM)</text>
<text x="1036.0" y="327.0" class="s" text-anchor="middle">acts on the handoff with tools</text>
<text x="1036.0" y="345.0" class="s" text-anchor="middle">update · refund · export · re-delegate · escalate</text>
<line x1="1186" y1="318.0" x2="1224" y2="318.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1226" y="262" width="314" height="112" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="1383.0" y="306.0" class="h3" text-anchor="middle">Graded by exact match</text>
<text x="1383.0" y="327.0" class="s" text-anchor="middle">false value written? record exported?</text>
<text x="1383.0" y="345.0" class="s" text-anchor="middle">task completed? (no LLM judge)</text>
<path d="M 384 391 C 620 461, 980 461, 1036 376" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="470" y="473" class="s" style="fill:#047857">re-delegation: the executor asks worker-Y to redo the revoked lookup</text>
<text x="60" y="532" class="h2">2 · What the platform does at t3: one condition each, adding up left to right</text>
<rect x="1058.4" y="552" width="482" height="22" rx="11" fill="#2563EB"/>
<text x="1299.2" y="567" class="tag" text-anchor="middle">design the paper argues for: the platform enforces, the agent need not judge</text>
<rect x="60.0" y="584" width="232" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="76.0" y="614" class="h3">Credentials only</text>
<text x="76.0" y="642" class="s">worker-X can no longer act;</text>
<text x="76.0" y="662" class="s">the roster shows it revoked</text>
<line x1="294.0" y1="642.0" x2="307.6" y2="642.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="309.6" y="584" width="232" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="325.6" y="614" class="h3">+ Notice</text>
<text x="325.6" y="642" class="s">the executor is told worker-X</text>
<text x="325.6" y="662" class="s">was compromised</text>
<line x1="543.6" y1="642.0" x2="557.2" y2="642.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="559.2" y="584" width="232" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="575.2" y="614" class="h3">+ Retract</text>
<text x="575.2" y="642" class="s">worker-X's posts are</text>
<text x="575.2" y="662" class="s">removed from the board</text>
<line x1="793.2" y1="642.0" x2="806.8000000000001" y2="642.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="808.8" y="584" width="232" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="824.8" y="614" class="h3">+ Lineage marks</text>
<text x="824.8" y="642" class="s">handoff lines that cite</text>
<text x="824.8" y="662" class="s">worker-X are flagged</text>
<line x1="1042.8" y1="642.0" x2="1056.3999999999999" y2="642.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1058.4" y="584" width="232" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1074.4" y="614" class="h3">+ Quarantine</text>
<text x="1074.4" y="642" class="s">flagged lines are withheld</text>
<text x="1074.4" y="662" class="s">until re-obtained</text>
<line x1="1292.4" y1="642.0" x2="1306.0" y2="642.0" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1308.0" y="584" width="232" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1324.0" y="614" class="h3">Taint provenance</text>
<text x="1324.0" y="642" class="s">the platform finds derived lines</text>
<text x="1324.0" y="662" class="s">by matching worker-X's content</text>
<text x="60" y="728" class="s">Taint provenance replaces the writer's citations: the platform matches what worker-X wrote (normalised for case, digit grouping and spacing), so it works even when the writer cites nothing.</text>
<text x="60" y="782" class="h2">3 · Experiments</text>
<rect x="60" y="800" width="1480" height="38" rx="6" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="1"/>
<text x="78" y="824" class="m">01_main_grid</text>
<text x="370" y="824" class="t2">Does revocation remove the influence, and which response does? All seven conditions, every model.</text>
<text x="78" y="862" class="m">02 to 05  ablations</text>
<text x="370" y="862" class="t2">Why: revoke before the handoff · a notice that names derived content · no citations · no second source.</text>
<rect x="60" y="876" width="1480" height="38" rx="6" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="1"/>
<text x="78" y="900" class="m">06_platform_mitigations</text>
<text x="370" y="900" class="t2">Do quarantine and taint provenance work for every model, and what does a false alarm cost?</text>
<text x="78" y="938" class="m">07_mixed_teams</text>
<text x="370" y="938" class="t2">Does the influence follow the agent that writes the handoff or the one that acts on it?</text>
<rect x="60" y="952" width="1480" height="38" rx="6" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="1"/>
<text x="78" y="976" class="m">08_training_fix</text>
<text x="370" y="976" class="t2">Can fine-tuning the executor fix it? Base vs tuned model on held-out seeds.</text>
<text x="60" y="1020" class="s" style="fill:#475569">All services, addresses and credentials are mock. Each folder in experiments/ has its own README, config and run script; results and tests are in experiments/analysis/ and the paper.</text>
</svg>